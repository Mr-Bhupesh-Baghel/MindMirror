<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track your daily water intake with MindMirror.">
  <title>MindMirror | Hydration</title>
  <link rel="stylesheet" href="../../styles/theme.css">
  <link rel="stylesheet" href="tracker.css">
  <link rel="stylesheet" href="../../styles/garden-mode.css">
</head>
<body>
  <main class="tracker-shell">
    <header class="page-header">
      <a class="back-link" href="../../../index.html">← Dashboard</a>
      <div class="page-heading">
        <p class="eyebrow">DAILY WELLBEING</p>
        <h1>Water your garden.</h1>
      </div>
      <span class="day-label" id="todayLabel"></span>
    </header>

    <div class="tracker-container">
      <section class="hero-panel" aria-labelledby="intakeText">
        <div class="hero-content">
          <p class="eyebrow">TODAY'S WATERING</p>
          <div class="progress-circle" id="progressCircle" role="img" aria-label="Today's water goal progress">
            <span id="progressText">0%</span>
          </div>
          <h2 id="intakeText">0 / 8 glasses</h2>
          <p class="hero-copy">A glass at a time is enough. Give yourself what you need and let the small acts of care add up.</p>
        </div>
      </section>

      <section class="control-panel" aria-label="Hydration controls">
        <div class="goal-card">
          <div>
            <label for="goalSelect">Daily goal</label>
            <p>Choose a target that fits your day.</p>
          </div>
          <select id="goalSelect" class="goal-select" aria-label="Daily water goal"></select>
        </div>

        <div class="quick-goals" aria-label="Quick goal options">
          <span>Quick select</span>
          <button type="button" data-goal="6">6 glasses</button>
          <button type="button" data-goal="8">8 glasses</button>
          <button type="button" data-goal="10">10 glasses</button>
          <button type="button" data-goal="12">12 glasses</button>
        </div>

        <div class="button-grid">
          <button type="button" class="primary-btn" onclick="addWater()">+ Add a glass</button>
          <button type="button" class="secondary-btn" onclick="removeWater()">− Remove one</button>
        </div>

        <div class="utility-actions">
          <button type="button" class="history-btn" onclick="viewProgress()">View history</button>
          <button type="button" class="danger-btn" onclick="deleteAll()">Clear local history</button>
        </div>

        <section class="history" id="historyBox" aria-live="polite">
          <h3>Recent entries</h3>
          <ul id="historyList"></ul>
        </section>
      </section>
    </div>
  </main>

  <script src="../../shared/storage.js"></script>
  <script src="../../shared/api-client.js"></script>
  <script src="tracker.js"></script>
</body>
</html>
