<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindMirror · 100-Day Push-up Challenge</title>
  <meta name="description" content="A calm, clear daily push-up challenge tracker.">
  <link rel="stylesheet" href="../../styles/app-shell.css">
</head>

<body>
  <main class="tool-shell">
    <header class="app-topbar">
      <a class="app-brand" href="../../../index.html"><span class="app-brand__mark"
          aria-hidden="true">M</span>MindMirror</a>
      <nav class="app-nav" aria-label="Primary navigation">
        <a href="../../../index.html">Home</a>
        <a href="../routine/routine.html">Routine</a>
        <a href="workout.html" aria-current="page">Workout</a>
        <a href="../water/water.html">Water</a>
        <a href="../account/account.html">Account</a>
      </nav>
    </header>

    <section class="app-card">
      <header class="page-intro">
        <div class="page-intro__copy">
          <p class="eyebrow">Progressive challenge</p>
          <h1>100 push-ups in one day.</h1>
          <p>Record each day at your own pace. The aim is a stronger, more consistent you.</p>
        </div>
      </header>

      <div id="summary" class="challenge-summary" aria-live="polite"></div>
      <div id="tracker"></div>

      <section style="margin-top: 28px" aria-labelledby="attempt-log-title">
        <div class="section-heading">
          <div>
            <h2 id="attempt-log-title">Daily attempt log</h2>
            <p>Every finished day stays here as a record of your work.</p>
          </div>
        </div>
        <div id="attempt-log">
          <ul id="attempt-list"></ul>
        </div>
      </section>
      <button type="button" class="reset-btn" id="resetTrackerBtn">Reset all challenge data</button>
    </section>
  </main>

  <script src="../../shared/storage.js"></script>
  <script src="pushup-challenge.js"></script>
</body>

</html>
