<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Push-up Challenge | MindMirror</title>
    <link rel="stylesheet" href="workout.css">
</head>

<body data-page="challenge">
    <main class="shell">
        <header class="topbar">
            <div>
                <h1>🏋️ 100-Day Push-up Challenge</h1>
                <p class="muted">One day at a time. Your records are safely tied to your account.</p>
            </div><a class="back" href="workout.html">← Workout</a>
        </header>
        <p id="notice" class="notice" aria-live="polite"></p>
        <div class="two-col">
            <section class="card">
                <h2>Progress</h2>
                <div class="progress"><span id="challenge-progress"></span></div>
                <p id="challenge-count">0 / 100 days</p>
                <div class="stats">
                    <div class="stat"><b id="challenge-total">0</b><small>total reps</small></div>
                    <div class="stat"><b id="challenge-streak">0</b><small>current streak</small></div>
                    <div class="stat"><b id="challenge-rate">0%</b><small>completion</small></div>
                </div>
                <h2>Log a challenge day</h2>
                <form id="challenge-form"><label for="challenge-date">Date</label><input id="challenge-date"
                        name="entryDate" type="date" required><label>Challenge day (1–100)</label><input
                        name="challengeDay" type="number" min="1" max="100" required><label>Target
                        push-ups</label><input name="targetCount" type="number" min="1" required><label>Completed
                        push-ups</label><input name="completedCount" type="number" min="0" required>
                    <div class="actions"><button>Save day</button></div>
                </form>
            </section>
            <section class="card">
                <h2>Challenge history</h2>
                <ul id="challenge-history" class="history">
                    <li class="empty">Sign in to load your history.</li>
                </ul>
            </section>
        </div>
    </main>
    <script src="../../shared/api-client.js"></script>
    <script src="workout.js"></script>
</body>

</html>
