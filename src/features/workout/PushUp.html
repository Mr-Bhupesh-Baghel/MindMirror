<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindMirror · 100-Day Push-up Challenge</title>
  <meta name="description" content="A calm, clear daily push-up challenge tracker.">
  <link rel="stylesheet" href="../../styles/app-shell.css">
</head>
<body>
  <main class="tool-shell">
    <header class="app-topbar">
      <a class="app-brand" href="../../../index.html"><span class="app-brand__mark" aria-hidden="true">M</span>MindMirror</a>
      <nav class="app-nav" aria-label="Primary navigation">
        <a href="../../../index.html">Home</a>
        <a href="../routine/routine.html">Routine</a>
        <a href="workout.html" aria-current="page">Workout</a>
        <a href="../water/water.html">Water</a>
        <a href="../account/account.html">Account</a>
      </nav>
    </header>

    <section class="app-card">
      <header class="page-intro">
        <div class="page-intro__copy">
          <p class="eyebrow">Progressive challenge</p>
          <h1>100 push-ups in one day.</h1>
          <p>Record each day at your own pace. The aim is a stronger, more consistent you.</p>
        </div>
      </header>

      <div id="summary" class="challenge-summary" aria-live="polite"></div>
      <div id="tracker"></div>

      <section style="margin-top: 28px" aria-labelledby="attempt-log-title">
        <div class="section-heading"><div><h2 id="attempt-log-title">Daily attempt log</h2><p>Every finished day stays here as a record of your work.</p></div></div>
        <div id="attempt-log"><ul id="attempt-list"></ul></div>
      </section>
      <button type="button" class="reset-btn" onclick="resetTracker()">Reset all challenge data</button>
    </section>
  </main>

  <script src="../../shared/storage.js"></script>
  <script>
    const totalDays = 100;
    const tracker = document.getElementById('tracker');
    const attemptList = document.getElementById('attempt-list');
    const summary = document.getElementById('summary');
    const progress = MindMirrorStorage.getJson('pushupProgress', {});

    const messages = [
      "Start strong!", "Keep going!", "Feeling it yet?", "Nice form!", "You're doing great!",
      "Push a bit harder!", "One step at a time!", "Consistency is key!", "Keep pushing!", "Discipline over motivation!",
      "10 days down!", "Leveling up!", "You’re stronger than you think!", "Crush it today!", "Midway milestone soon!",
      "Body is transforming!", "Respect your progress!", "Push harder!", "Don’t slow down!", "Halfway done!",
      "Now it gets fun!", "More control, more strength!", "You're a machine!", "This is your routine!", "Mind over muscle!",
      "You inspire yourself!", "Momentum is real!", "Stay sharp!", "Only a few days left!", "Push-up master loading…",
      "This habit = power!", "No breaks now!", "Fire mode on!", "Keep proving it!", "Discipline > excuses!",
      "Almost there!", "Strength, grit, growth!", "Big goals, small steps!", "Never back down!", "Beast mode unlocked!",
      "Closer than ever!", "Keep going strong!", "Legend mode starting!", "Break all limits!", "Hard work pays off!",
      "Final lap!", "Stay consistent!", "Push-up boss!", "Almost 100!", "100/100 — mission complete!"
    ];

    function renderTracker() {
      tracker.innerHTML = '';
      const totalCompleted = Object.keys(progress).length;

      if (totalCompleted >= totalDays) {
        summary.innerHTML = '<h2>Challenge complete!</h2><p>You’ve completed all 100 days. Keep logging if you want to continue the habit.</p>';
      } else {
        summary.innerHTML = `<p>Progress: <strong>${totalCompleted}/${totalDays}</strong> days completed.</p>`;
      }

      const trackerLength = Math.max(totalDays, totalCompleted + 5);
      for (let i = 1; i <= trackerLength; i++) {
        const record = progress[i] || { status: 'pending', count: 0, date: null };
        const target = i;
        const message = messages[i - 1] || 'Keep the streak alive!';
        const div = document.createElement('div');
        div.className = `day ${record.status}`;
        div.innerHTML = `
          <div>
            <div><strong>Day ${i}</strong></div>
            <div class="target">Target: ${target} push-ups</div>
            <div class="message">${message}</div>
            <div class="record">You did: <strong>${record.count || 0}</strong> ${record.date ? `on ${record.date}` : ''}</div>
            <input type="number" id="input-${i}" class="count-input" placeholder="Enter push-ups" min="0" aria-label="Push-ups completed on day ${i}">
          </div>
          <div><button type="button" class="done-btn" onclick="markDone(${i})" ${record.status === 'done' ? 'disabled' : ''}>Mark done</button></div>`;
        tracker.appendChild(div);
      }
      renderAttemptLog();
      updateSummary();
    }

    function markDone(day) {
      const input = document.getElementById(`input-${day}`);
      const count = parseInt(input.value) || 0;
      const date = new Date().toLocaleDateString();
      progress[day] = { status: 'done', count, date };
      MindMirrorStorage.setJson('pushupProgress', progress);
      renderTracker();
    }

    function renderAttemptLog() {
      attemptList.innerHTML = '';
      const days = Object.keys(progress).sort((a, b) => a - b);
      days.forEach(day => {
        const rec = progress[day];
        if (rec.status === 'done') {
          const li = document.createElement('li');
          li.textContent = `Day ${day} — ${rec.count} push-ups on ${rec.date}`;
          attemptList.appendChild(li);
        }
      });
      if (days.length === 0) attemptList.innerHTML = '<li>No attempts yet. Start today.</li>';
    }

    function updateSummary() {
      const records = Object.values(progress).filter(r => r.status === 'done');
      const totalPushups = records.reduce((sum, r) => sum + r.count, 0);
      const average = records.length ? (totalPushups / records.length).toFixed(1) : 0;
      const lastDate = records.length ? records[records.length - 1].date : '—';
      summary.innerHTML += `<p>Total push-ups: <strong>${totalPushups}</strong> &nbsp;·&nbsp; Average: <strong>${average}</strong> &nbsp;·&nbsp; Last activity: <strong>${lastDate}</strong></p>`;
    }

    function resetTracker() {
      if (confirm('Are you sure you want to reset all data?')) {
        for (const key in progress) delete progress[key];
        MindMirrorStorage.setJson('pushupProgress', progress);
        renderTracker();
      }
    }

    renderTracker();
  </script>
</body>
</html>
