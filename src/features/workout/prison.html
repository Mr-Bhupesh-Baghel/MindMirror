<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Prison Workout | MindMirror</title>
    <link rel="stylesheet" href="workout.css">
</head>

<body data-page="prison">
    <main class="shell">
        <header class="topbar">
            <div>
                <h1>📋 Prison Workout Builder</h1>
                <p class="muted">A high-to-low, low-to-high ladder — generated for any exercise.</p>
            </div><a class="back" href="workout.html">← Workout</a>
        </header>
        <p id="notice" class="notice" aria-live="polite"></p>
        <div class="two-col">
            <section class="card">
                <h2>Create your ladder</h2>
                <form id="generator-form"><label>Exercise</label><input name="exerciseName" maxlength="120"
                        value="Push-ups" required><label>Starting number</label><input name="startingNumber"
                        type="number" min="2" max="500" value="10" required>
                    <div class="actions"><button>Generate workout</button></div>
                </form>
                <div id="workout-output"></div>
            </section>
            <section class="card">
                <h2>Saved workouts</h2>
                <ul id="workout-history" class="history">
                    <li class="empty">Sign in to load your history.</li>
                </ul>
            </section>
        </div>
    </main>
    <script src="../../shared/api-client.js"></script>
    <script src="workout.js"></script>
</body>

</html>
