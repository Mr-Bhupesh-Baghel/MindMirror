<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindMirror · Workout Generator</title>
  <meta name="description" content="Generate a descending workout set plan and save it for later.">
  <link rel="stylesheet" href="../../styles/app-shell.css">
</head>

<body>
  <main class="tool-shell">
    <header class="app-topbar">
      <a class="app-brand" href="../../../index.html"><span class="app-brand__mark"
          aria-hidden="true">M</span>MindMirror</a>
      <nav class="app-nav" aria-label="Primary navigation">
        <a href="../../../index.html">Home</a>
        <a href="../routine/routine.html">Routine</a>
        <a href="workout.html" aria-current="page">Workout</a>
        <a href="../water/water.html">Water</a>
        <a href="../account/account.html">Account</a>
      </nav>
    </header>

    <section class="tool-card">
      <header class="page-intro">
        <div class="page-intro__copy">
          <p class="eyebrow">Workout generator</p>
          <h1>Build your set plan.</h1>
          <p>Start with your highest rep count and get a simple descending workout in seconds.</p>
        </div>
      </header>

      <div class="exercise-form">
        <div>
          <label class="field-label" for="exercise">Exercise name</label>
          <input type="text" id="exercise" placeholder="Push-ups" value="Push-ups">
        </div>
        <div>
          <label class="field-label" for="number">Starting number</label>
          <input type="number" id="number" min="2" value="10">
        </div>
        <div class="form-actions"><button type="button" onclick="generateWorkout()">Generate workout</button></div>
      </div>

      <div id="result" aria-live="polite"></div>

      <div class="history-actions">
        <button type="button" id="saveBtn">Save workout</button>
        <button type="button" class="secondary" onclick="viewHistory()">View history</button>
        <button type="button" class="danger-button" onclick="clearHistory()">Clear history</button>
      </div>
      <div id="history" aria-live="polite"></div>
    </section>
  </main>

  <script>
    function clearHistory() {
      if (confirm("Delete all workout history?")) {
        localStorage.removeItem("prisonWorkoutHistory");
        document.getElementById("history").innerHTML = "";
        alert("History deleted.");
      }
    }

    function viewHistory() {
      const historyDiv = document.getElementById("history");
      const history = JSON.parse(localStorage.getItem("prisonWorkoutHistory")) || [];

      if (history.length === 0) {
        historyDiv.innerHTML = "<div class='history-card'><p>No workout history yet.</p></div>";
        return;
      }

      let html = "<h2 style='margin-top: 22px'>Workout history</h2>";
      [...history].reverse().forEach(item => {
        html += `
          <div class="history-card">
            <strong>${item.exercise}</strong><br>
            Starting number: ${item.startNumber}<br>
            ${item.totalReps}<br>
            <span class="helper-text">${item.date}</span>
          </div>`;
      });
      historyDiv.innerHTML = html;
    }

    document.getElementById("saveBtn").addEventListener("click", () => {
      const exercise = document.getElementById("exercise").value || "Exercise";
      const startNumber = parseInt(document.getElementById("number").value);
      const totalReps = document.querySelector(".total") ? document.querySelector(".total").innerText : "";
      const history = JSON.parse(localStorage.getItem("prisonWorkoutHistory")) || [];

      history.push({ exercise, startNumber, totalReps, date: new Date().toLocaleString() });
      localStorage.setItem("prisonWorkoutHistory", JSON.stringify(history));
      alert("Workout saved!");
    });

    function generateWorkout() {
      const exercise = document.getElementById("exercise").value || "Exercise";
      const n = parseInt(document.getElementById("number").value);
      const result = document.getElementById("result");
      result.innerHTML = "";

      if (n < 2) {
        result.innerHTML = "<div class='total'>Enter a number greater than 1.</div>";
        return;
      }

      let low = 1;
      let high = n;
      let set = 1;
      let total = 0;
      const workout = [];

      while (high >= low) {
        workout.push({ set, reps: high });
        total += high;
        set++;
        if (high === low) break;
        workout.push({ set, reps: low });
        total += low;
        set++;
        high--;
        low++;
      }

      workout.forEach(item => {
        result.innerHTML += `<div class="set"><strong>Set ${item.set}</strong><br>${item.reps} ${exercise}</div>`;
      });
      result.innerHTML += `<div class="total">Total reps: ${total}</div>`;

      localStorage.setItem("prisonWorkout", JSON.stringify({
        exercise,
        startNumber: n,
        totalReps: total,
        workout,
        date: new Date().toLocaleDateString()
      }));
    }

    generateWorkout();
  </script>
</body>

</html>
