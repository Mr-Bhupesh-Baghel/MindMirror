<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Maintenance | MindMirror</title>
    <link rel="stylesheet" href="workout.css">
</head>

<body data-page="maintenance">
    <main class="shell">
        <header class="topbar">
            <div>
                <h1>🔥 Push-up Maintenance</h1>
                <p class="muted">Keep your old capacity alive with a simple daily record.</p>
            </div><a class="back" href="workout.html">← Workout</a>
        </header>
        <p id="notice" class="notice" aria-live="polite"></p>
        <div class="two-col">
            <section class="card">
                <h2>Maintenance stats</h2>
                <div class="stats">
                    <div class="stat"><b id="maintenance-total">0</b><small>total reps</small></div>
                    <div class="stat"><b id="maintenance-days">0</b><small>days logged</small></div>
                    <div class="stat"><b id="maintenance-streak">0</b><small>current streak</small></div>
                </div>
                <p>Average: <b id="maintenance-average">0</b> reps/day</p>
                <h2>Log today</h2>
                <form id="maintenance-form"><label for="maintenance-date">Date</label><input id="maintenance-date"
                        name="entryDate" type="date" required><label>Push-ups completed</label><input
                        name="pushupsCount" type="number" min="1" required><label>Maintain day (optional)</label><input
                        name="challengeDay" type="number" min="1" max="365">
                    <div class="actions"><button>Save record</button></div>
                </form>
            </section>
            <section class="card">
                <h2>History</h2>
                <ul id="maintenance-history" class="history">
                    <li class="empty">Sign in to load your history.</li>
                </ul>
            </section>
        </div>
    </main>
    <script src="../../shared/api-client.js"></script>
    <script src="workout.js"></script>
</body>

</html>
