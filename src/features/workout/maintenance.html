<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindMirror · Capacity Maintenance</title>
  <meta name="description" content="Maintain your push-up capacity with a simple 365-day log.">
  <link rel="stylesheet" href="../../styles/app-shell.css">
</head>
<body>
  <main class="tool-shell">
    <header class="app-topbar">
      <a class="app-brand" href="../../../index.html"><span class="app-brand__mark" aria-hidden="true">M</span>MindMirror</a>
      <nav class="app-nav" aria-label="Primary navigation">
        <a href="../../../index.html">Home</a>
        <a href="../routine/routine.html">Routine</a>
        <a href="workout.html" aria-current="page">Workout</a>
        <a href="../water/water.html">Water</a>
        <a href="../account/account.html">Account</a>
      </nav>
    </header>

    <section class="maintenance-card">
      <div class="app-card" id="challenge-section">
        <header class="page-intro">
          <div class="page-intro__copy">
            <p class="eyebrow">365-day practice</p>
            <h1>Maintain your capacity.</h1>
            <p>Mark each day you keep your strength baseline, then log the number you reached.</p>
          </div>
        </header>

        <div class="progress-bar" aria-label="Challenge progress"><div class="progress" id="challengeProgress"></div></div>
        <p id="challengeInfo" class="helper-text">Progress: 0 / 365 days</p>

        <button type="button" class="add-btn" style="width: 100%; margin-top: 16px" onclick="completeChallengeDay()">I maintained my capacity today</button>

        <div style="margin-top: 20px">
          <label class="field-label" for="pushupCount">Today’s capacity</label>
          <div class="input-group">
            <input type="number" id="pushupCount" min="1" placeholder="Enter push-ups">
            <button type="button" class="add-btn" onclick="addMaintenanceRecord()">Add record</button>
          </div>
        </div>

        <div class="record-list" id="recordList" aria-label="Capacity history"></div>
        <button type="button" class="reset-btn" style="width: 100%; margin-top: 16px" onclick="deleteAllData()">Delete all data</button>
      </div>
    </section>
  </main>

  <script src="../../shared/storage.js"></script>
  <script>
    const totalDays = 365;
    let completedDays = MindMirrorStorage.getJson("completedDays", 0);
    let maintenanceRecords = MindMirrorStorage.getJson("maintenanceRecords", []);

    function updateChallengeProgress() {
      const progress = document.getElementById("challengeProgress");
      const info = document.getElementById("challengeInfo");
      progress.style.width = (completedDays / totalDays) * 100 + "%";
      progress.textContent = completedDays ? `${Math.round((completedDays / totalDays) * 100)}%` : "";
      info.textContent = `Progress: ${completedDays} / ${totalDays} days`;
      MindMirrorStorage.setJson("completedDays", completedDays);
    }

    function completeChallengeDay() {
      if (completedDays < totalDays) {
        completedDays++;
        updateChallengeProgress();
      } else {
        alert("Congratulations! You’ve completed your 365-day challenge!");
      }
    }

    function addMaintenanceRecord() {
      const count = parseInt(document.getElementById("pushupCount").value);
      if (!count || count <= 0) return alert("Enter a valid number of push-ups.");
      maintenanceRecords.push({ date: new Date().toLocaleDateString(), pushups: count });
      MindMirrorStorage.setJson("maintenanceRecords", maintenanceRecords);
      document.getElementById("pushupCount").value = "";
      renderMaintenanceRecords();
    }

    function renderMaintenanceRecords() {
      const list = document.getElementById("recordList");
      list.innerHTML = maintenanceRecords.length
        ? maintenanceRecords.map(rec => `<div class="record-item"><strong>${rec.date}</strong><br>${rec.pushups} push-ups</div>`).join("")
        : '<div class="record-item helper-text">No capacity records yet.</div>';
    }

    function deleteAllData() {
      if (!confirm("Are you sure you want to delete all data?")) return;
      MindMirrorStorage.remove("completedDays");
      MindMirrorStorage.remove("maintenanceRecords");
      completedDays = 0;
      maintenanceRecords = [];
      updateChallengeProgress();
      renderMaintenanceRecords();
      alert("All data cleared.");
    }

    updateChallengeProgress();
    renderMaintenanceRecords();
  </script>
</body>
</html>
