<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Tracker</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:"Segoe UI",Arial,sans-serif;
            background:linear-gradient(135deg,#e0f7ff,#dbeafe);
            min-height:100vh;
            padding:20px;
        }

        /* ================= Top Bar ================= */

        .topbar{

            max-width:1200px;

            margin:auto auto 20px;

            background:#fff;

            border-radius:18px;

            padding:16px 24px;

            display:flex;

            justify-content:space-between;

            align-items:center;

            box-shadow:0 8px 25px rgba(0,0,0,.12);

            flex-wrap:wrap;

            gap:15px;

        }

        .title h1{

            font-size:1.8rem;

            color:#0f172a;

        }

        .title p{

            color:#64748b;

            margin-top:4px;

        }

        .actions{

            display:flex;

            gap:12px;

            flex-wrap:wrap;

        }

        .btn{

            border:none;

            padding:12px 18px;

            border-radius:10px;

            cursor:pointer;

            font-size:15px;

            font-weight:600;

            transition:.3s;

        }

        .primary{

            background:#0ea5e9;

            color:#fff;

        }

        .primary:hover{

            background:#0284c7;

        }

        .secondary{

            background:#334155;

            color:white;

        }

        .secondary:hover{

            background:#1e293b;

        }

        /* ================= Viewer ================= */

        .viewer{

            max-width:1200px;

            margin:auto;

            background:white;

            border-radius:20px;

            overflow:hidden;

            box-shadow:0 15px 40px rgba(0,0,0,.15);

        }

        iframe{

            width:100%;

            height:calc(100vh - 170px);

            min-height:700px;

            border:none;

            display:block;

        }

        @media(max-width:768px){

            body{

                padding:12px;

            }

            .topbar{

                flex-direction:column;

                text-align:center;

            }

            .actions{

                width:100%;

                justify-content:center;

            }

            .btn{

                flex:1;

                min-width:150px;

            }

            iframe{

                min-height:650px;

            }

        }

        @media(max-width:480px){

            iframe{

                min-height:600px;

            }

            .btn{

                width:100%;

            }

        }

    </style>

</head>

<body>

<div class="topbar">

    <div class="title">

        <h1>💧 Water Tracker</h1>

        <p>Stay hydrated. Build healthy habits.</p>

    </div>

    <div class="actions">

        <button
            class="btn secondary"
            onclick="window.open('https://mr-bhupesh-baghel.github.io/MindMirror/','_blank')">

            🏠 Home

        </button>

        <button
            class="btn primary"
            onclick="window.open('water-tracker.html','_blank')">

            ↗ Open Full Screen

        </button>

    </div>

</div>

<div class="viewer">

    <iframe
        src="water-tracker.html"
        title="Water Tracker">
    </iframe>

</div>

</body>
</html>
