<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Water Tracker</title>

    <link rel="stylesheet" href="water-tracker.css">
</head>

<body>

<main class="tracker-shell">

<div class="tracker-container">

    <!-- ================= HEADER ================= -->

    <header class="page-header">

        <h1>💧 Water Tracker</h1>

        <p>
            Stay hydrated. Stay healthy.
        </p>

    </header>

    <!-- ================= TODAY'S PROGRESS ================= -->

    <section class="progress-card">

        <div
            class="progress-circle"
            id="progressCircle">

            <span id="progressText">
                0%
            </span>

        </div>

        <h2 id="intakeText">

            0 / 8 Glasses

        </h2>

    </section>

    <!-- ================= DAILY GOAL ================= -->

    <section class="goal-card">

        <h2>🎯 Daily Goal</h2>

        <p>
            Choose your hydration target.
        </p>

        <select
            id="goalSelect"
            class="goal-select">
        </select>

    </section>

    <!-- ================= QUICK GOALS ================= -->

    <section class="quick-goals-card">

        <h2>⚡ Quick Select</h2>

        <div class="quick-goals">

            <button data-goal="6">6</button>

            <button data-goal="8">8</button>

            <button data-goal="10">10</button>

            <button data-goal="12">12</button>

        </div>

    </section>

    <!-- ================= MAIN ACTIONS ================= -->

    <section class="action-card">

        <h2>🥤 Record Water</h2>

        <div class="button-grid">

            <button
                class="primary-btn"
                onclick="addWater()">

                ➕ Add Glass

            </button>

            <button
                class="secondary-btn"
                onclick="removeWater()">

                ➖ Remove Glass

            </button>

        </div>

    </section>

    <!-- ================= OTHER ACTIONS ================= -->

    <section class="action-card">

        <h2>📊 More Options</h2>

        <div class="button-grid">

            <button
                class="history-btn"
                onclick="viewProgress()">

                📅 View History

            </button>

            <button
                class="danger-btn"
                onclick="deleteAll()">

                🗑 Delete All

            </button>

        </div>

    </section>

    <!-- ================= HISTORY ================= -->

    <section
        class="history-card"
        id="historyBox">

        <h2>
            📅 History
        </h2>

        <ul id="historyList"></ul>

    </section>

</div>

</main>

<script src="../../shared/storage.js"></script>
<script src="../../shared/api-client.js"></script>

<script src="water-tracker.js"></script>

</body>
</html>
