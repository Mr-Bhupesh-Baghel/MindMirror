<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Routine Tracker</title>

    <meta name="description"
        content="Track your daily routines, habits and productivity.">

    <link rel="stylesheet" href="routine.css">
</head>

<body>

<main class="container">

    <!-- ================= Header ================= -->

    <header class="hero">

        <div>

            <h1>📅 Daily Routine Tracker</h1>

            <p class="subtitle">
                Build better habits every day.
            </p>

        </div>

    </header>

    <!-- ================= Progress ================= -->

    <section class="card">

        <div class="section-title">

            <h2>Today's Progress</h2>


        </div>

        <div class="progress-bar">

            <div id="progress" class="progress">
                0%
            </div>

        </div>

    </section>

    <!-- ================= Daily Affirmations ================= -->

    <section class="card">

        <h2>✨ Daily Affirmations</h2>

        <ul id="affirmationList"></ul>

    </section>

    <!-- ================= Holiday Tasks ================= -->

    <section class="card">

        <h2>🎉 Holiday Tasks</h2>

        <div id="HtaskContainer"></div>

    </section>

    <!-- ================= Daily Tasks ================= -->

    <section class="card">

        <h2>✅ Today's Tasks</h2>

        <div id="taskContainer"></div>

    </section>

    <!-- ================= Quick Actions ================= -->

    <section class="card">

        <h2>⚡ Quick Actions</h2>

        <div class="button-grid">

            <button onclick="submitAndNextDay()">
                Submit & Next Day
            </button>

            <button onclick="viewPrevious()">
                View Previous
            </button>

            <button onclick="exportToExcel()">
                Download Excel
            </button>

            <button
                class="danger-button"
                onclick="deleteSpecificData()">

                Delete Progress

            </button>

        </div>

    </section>

    <!-- ================= Add Daily Task ================= -->

    <section class="card">

        <h2>➕ Add Daily Task</h2>

        <div class="input-group">

            <input
                id="customTaskInput"
                type="text"
                placeholder="Enter task">

            <button onclick="addCustomTask()">
                Add Task
            </button>

        </div>

    </section>

    <!-- ================= Add Holiday Task ================= -->

    <section class="card">

        <h2>🌴 Add Holiday Task</h2>

        <div class="input-group">

            <input
                id="HolidayTaskInput"
                type="text"
                placeholder="Holiday task">

            <button onclick="addHolidayTask()">
                Add Holiday Task
            </button>

        </div>

    </section>

    <!-- ================= Add Affirmation ================= -->

    <section class="card">

        <h2>💬 Add Affirmation</h2>

        <div class="input-group">

            <input
                id="affirmationInput"
                type="text"
                placeholder="Write today's affirmation">

            <button id="addBtn">
                Add
            </button>

        </div>

        <br>

        <button
            id="clearAllBtn"
            class="danger-button">

            Delete All Affirmations

        </button>

    </section>

</main>

<script src="../../shared/storage.js"></script>
<script src="routine.js"></script>
<script src="holiday-tasks.js"></script>

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

</body>
</html>
