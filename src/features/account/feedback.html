<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MindMirror Feedback</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

font-family:"Segoe UI",Arial,sans-serif;

background:linear-gradient(135deg,#dbeafe,#eff6ff);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}

.feedback-container{

width:min(100%,500px);

background:white;

border-radius:20px;

padding:30px;

box-shadow:0 15px 40px rgba(0,0,0,.12);

}

.header{

text-align:center;

margin-bottom:25px;

}

.header h1{

font-size:2rem;

margin-bottom:8px;

}

.header p{

color:#64748b;

}

.section{

margin-bottom:24px;

}

.section h2{

font-size:1rem;

margin-bottom:12px;

color:#0f172a;

}

label{

display:block;

margin-bottom:6px;

font-weight:600;

}

input,
textarea{

width:100%;

padding:12px;

border:1px solid #d1d5db;

border-radius:10px;

font-size:15px;

margin-bottom:14px;

}

textarea{

height:120px;

resize:vertical;

}

.stars{

display:flex;

justify-content:center;

gap:10px;

flex-direction:row-reverse;

}

.stars input{

display:none;

}

.stars label{

font-size:34px;

cursor:pointer;

color:#cbd5e1;

transition:.2s;

}

.stars input:checked~label,
.stars label:hover,
.stars label:hover~label{

color:#fbbf24;

}

.submit-btn{

width:100%;

padding:14px;

border:none;

border-radius:10px;

background:#2563eb;

color:white;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:.3s;

}

.submit-btn:hover{

background:#1d4ed8;

}

#thankYouPopup{

display:none;

position:fixed;

inset:0;

background:rgba(0,0,0,.5);

justify-content:center;

align-items:center;

padding:20px;

}

.popup{

background:white;

padding:30px;

border-radius:18px;

text-align:center;

max-width:350px;

width:100%;

}

.popup h2{

margin-bottom:10px;

}

.popup p{

margin-bottom:20px;

color:#475569;

}

.popup button{

padding:12px 24px;

border:none;

border-radius:8px;

background:#16a34a;

color:white;

cursor:pointer;

font-weight:600;

}

@media(max-width:480px){

.feedback-container{

padding:22px;

}

.header h1{

font-size:1.7rem;

}

}

</style>

</head>

<body>

<div class="feedback-container">

<div class="header">

<h1>💬 Feedback</h1>

<p>

Help us improve MindMirror.

</p>

</div>

<div class="section">

<h2>👤 Personal Information</h2>

<label>Name</label>

<input
type="text"
id="name"
placeholder="Enter your name">

<label>Email</label>

<input
type="email"
id="email"
placeholder="Enter your email">

</div>

<div class="section">

<h2>⭐ Rate Your Experience</h2>

<div class="stars">

<input type="radio" id="star5" name="star" value="5">
<label for="star5">★</label>

<input type="radio" id="star4" name="star" value="4">
<label for="star4">★</label>

<input type="radio" id="star3" name="star" value="3">
<label for="star3">★</label>

<input type="radio" id="star2" name="star" value="2">
<label for="star2">★</label>

<input type="radio" id="star1" name="star" value="1">
<label for="star1">★</label>

</div>

</div>

<div class="section">

<h2>📝 Your Feedback</h2>

<textarea
id="message"
placeholder="Tell us what you like or what we can improve..."></textarea>

</div>

<button
id="submitFeedback"
class="submit-btn">

Submit Feedback

</button>

</div>

<div id="thankYouPopup">

<div class="popup">

<h2>🎉 Thank You!</h2>

<p>

Your feedback has been saved successfully.

</p>

<button onclick="closePopup()">

Close

</button>

</div>

</div>

<script src="../../shared/storage.js"></script>

<script>

const feedbackList=MindMirrorStorage.getJson("feedbackList",[]);

document.getElementById("submitFeedback").addEventListener("click",()=>{

const name=document.getElementById("name").value.trim();

const email=document.getElementById("email").value.trim();

const message=document.getElementById("message").value.trim();

const rating=document.querySelector('input[name="star"]:checked')?.value||"";

if(!name||!email||!rating||!message){

alert("⚠ Please fill all fields.");

return;

}

feedbackList.push({

name,

email,

rating,

message,

date:new Date().toISOString().split("T")[0]

});

MindMirrorStorage.setJson("feedbackList",feedbackList);

document.getElementById("name").value="";

document.getElementById("email").value="";

document.getElementById("message").value="";

document.querySelectorAll('input[name="star"]').forEach(s=>s.checked=false);

document.getElementById("thankYouPopup").style.display="flex";

});

function closePopup(){

document.getElementById("thankYouPopup").style.display="none";

}

</script>

</body>
</html>
