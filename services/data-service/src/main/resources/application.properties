spring.application.name=data-service
server.port=8083
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mindmirror?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
mindmirror.token-secret=${MINDMIRROR_TOKEN_SECRET:change-this-development-secret}
