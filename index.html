<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="MindMirror - Track your screen time and daily habits for a healthier digital lifestyle." />
  <meta name="author" content="MindMirror" />
  <title>MindMirror - Home</title>
  <link rel="stylesheet" href="src/styles/global.css" />
</head>

<body>
  
<video autoplay muted loop playsinline id="bg-video">
    <source src="videos/storm.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

  <div class="container">
    <header>
      <img src="src/assets/logo.png" alt="MindMirror Logo" class="logo" />
      <h1>MindMirror</h1>
      <p class="subtitle">Track your habits. Protect your mind.</p>
    </header>

    <section class="card">
      <iframe src="src/features/routine/routine.html" class="routine-preview-frame" title="Daily Routine Top Bar"></iframe>
      <h2>Daily Routine Tracker</h2>
      <div class="template-section">
        <a href="src/features/routine/routine.html" class="template-button" aria-label="Open Daily Routine Tracker">Open</a>
      </div>
    </section>

    <section class="habit-frames">
      <iframe src="src/features/workout/workout.html" class="habit-frame habit-frame-large" title="Pushups Tracker"></iframe>
      <iframe src="src/features/water/water.html" class="habit-frame habit-frame-small" title="Water Tracker"></iframe>
    </section>

    <section class="card feedback-card">
      <a href="src/features/feedback/feedback.html" class="template-button" aria-label="Open Feedback">Feedback</a>
    </section>

    <section class="card account-card" data-auth-dashboard>
      <div class="account-card-header">
        <div>
          <h2>Account Sync</h2>
          <p data-auth-status>Sign in to back up local progress.</p>
        </div>
        <span class="network-pill" data-network-status>Online</span>
      </div>

      <div class="auth-forms">
        <form class="auth-form" data-login-form>
          <h3>Login</h3>
          <input name="email" type="email" autocomplete="email" placeholder="Email" required />
          <input name="password" type="password" autocomplete="current-password" placeholder="Password" required />
          <button class="template-button" type="submit">Login</button>
        </form>

        <form class="auth-form" data-register-form>
          <h3>Register</h3>
          <input name="displayName" type="text" autocomplete="name" placeholder="Display name" maxlength="120" required />
          <input name="email" type="email" autocomplete="email" placeholder="Email" required />
          <input name="password" type="password" autocomplete="new-password" placeholder="Password" required />
          <button class="template-button" type="submit">Create Account</button>
        </form>
      </div>

      <div class="sync-dashboard">
        <progress data-sync-progress hidden></progress>
        <p data-sync-status>No local browser data is waiting.</p>
        <p class="sync-timestamp" data-last-sync>Last sync: Never</p>
        <div class="template-section">
          <button class="template-button" type="button" data-sync-now>Sync Now</button>
          <button class="template-button secondary-button" type="button" data-cleanup-local hidden>Clean Up Local Data</button>
          <button class="template-button secondary-button" type="button" data-logout>Logout</button>
        </div>
      </div>
    </section>

    <footer>
      <p>(c) 2026 MindMirror. All rights reserved.</p>
    </footer>
  </div>
  <script src="src/shared/storage.js"></script>
  <script src="src/shared/api-client.js"></script>
  <script src="src/shared/local-data-migration.js"></script>
  <script src="src/shared/auth-dashboard.js"></script>
  <script>
    MindMirrorAuthDashboard.create(document.querySelector("[data-auth-dashboard]"));
  </script>
</body>

</html>
