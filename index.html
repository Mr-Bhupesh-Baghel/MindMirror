<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="MindMirror - Track your screen time and daily habits for a healthier digital lifestyle." />
  <meta name="author" content="MindMirror" />
  <title>MindMirror - Home</title>
  <link rel="stylesheet" href="src/styles/global.css" />
</head>

<body>
  
<video autoplay muted loop playsinline id="bg-video">
    <source src="videos/storm.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

  <div class="container">
    <header>
      <img src="src/assets/logo.png" alt="MindMirror Logo" class="logo" />
      <h1>MindMirror</h1>
      <p class="subtitle">Track your habits. Protect your mind.</p>
    </header>

    <section class="card">
      <iframe src="src/features/routine/routine.html" class="routine-preview-frame" title="Daily Routine Top Bar"></iframe>
      <h2>Daily Routine Tracker</h2>
      <div class="template-section">
        <a href="src/features/routine/routine.html" class="template-button" aria-label="Open Daily Routine Tracker">Open</a>
      </div>
    </section>

    <section class="habit-frames">
      <iframe src="src/features/workout/workout.html" class="habit-frame habit-frame-large" title="Pushups Tracker"></iframe>
      <iframe src="src/features/water/water.html" class="habit-frame habit-frame-small" title="Water Tracker"></iframe>
    </section>

    <section class="card feedback-card">
      <a href="src/features/feedback/feedback.html" class="template-button" aria-label="Open Feedback">Feedback</a>
    </section>

    <section class="card migration-card">
      <h2>Local Data Migration</h2>
      <p id="migrationStatus">Keep local progress backed up after signing in.</p>
      <input
        id="migrationToken"
        class="migration-input"
        type="password"
        autocomplete="off"
        placeholder="Paste access token after login"
        aria-label="Access token"
      />
      <div class="template-section">
        <button id="saveMigrationToken" class="template-button" type="button">Save Token</button>
        <button id="runMigration" class="template-button" type="button">Sync Local Data</button>
      </div>
    </section>

    <footer>
      <p>(c) 2026 MindMirror. All rights reserved.</p>
    </footer>
  </div>
  <script src="src/shared/storage.js"></script>
  <script src="src/shared/api-client.js"></script>
  <script src="src/shared/local-data-migration.js"></script>
  <script>
    const migrationStatus = document.getElementById("migrationStatus");
    const migrationToken = document.getElementById("migrationToken");

    function renderMigrationStatus(status = MindMirrorMigration.getStatus()) {
      const queued = status.queued ? ` Queued: ${status.queued}.` : "";
      migrationStatus.textContent = `${status.message || "Ready to sync local data."}${queued}`;
    }

    document.getElementById("saveMigrationToken").addEventListener("click", () => {
      const token = migrationToken.value.trim();
      if (!token) {
        renderMigrationStatus({ message: "Paste an access token first." });
        return;
      }

      MindMirrorApi.setSession({ accessToken: token });
      migrationToken.value = "";
      renderMigrationStatus({ message: "Token saved. Sync can run now." });
    });

    document.getElementById("runMigration").addEventListener("click", async () => {
      renderMigrationStatus({ message: "Syncing local data..." });
      try {
        renderMigrationStatus(await MindMirrorMigration.run());
      } catch (error) {
        renderMigrationStatus({ message: `Sync failed: ${error.message}` });
      }
    });

    window.addEventListener("mindmirror:migration-status", event => {
      renderMigrationStatus(event.detail);
    });

    renderMigrationStatus();
  </script>
</body>

</html>
