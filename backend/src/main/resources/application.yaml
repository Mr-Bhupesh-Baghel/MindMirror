spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mindmirror}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8082

app:
  auth:
    token-days: 30
